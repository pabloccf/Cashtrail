<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home screen icon on iOS. Safari does not accept SVG here, so it is a 180x180 PNG.
         Square and without transparency: iOS rounds the corners itself -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Name under the icon on the home screen (otherwise iOS uses the <title>) -->
    <meta name="apple-mobile-web-app-title" content="Cashtrail" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Color of the browser bar on mobile (brand-600) -->
    <meta name="theme-color" content="#4f39f6" />
    <!-- preconnect opens the connection to Google Fonts early, so the font arrives sooner.
         display=swap shows the text with a system font until Inter has loaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <title>Cashtrail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
