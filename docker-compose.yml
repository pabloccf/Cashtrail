# Local development database only. Production uses Neon.
services:
  db:
    image: postgres:17
    container_name: cashtrail-db
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB (see backend/.env.example)
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - cashtrail-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cashtrail-data:
